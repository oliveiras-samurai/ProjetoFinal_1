{% extends 'base.html' %}
{% block conteudo %}

<h1> Tipo da Tarefa: </h1>
<form action="{{url_for('tipo_atividade')}}" method="post">

        Nome do tipo:
        <input name="form_tipo" type="text" placeholder="Ex: texto de rescisão" required

    </label>
    <br>
    <br>

    <label>
        Descrição do Tipo:
        <br>
        <textarea name="form_descricao_tipo" rows="10" cols="50" required></textarea>
    </label>
    <br>
    <label>

        ID do tipo:
        <input name="form_tipo_id" type="text" placeholder="Ex: 154632" required

    </label>
    <br>
    <br>
    </label>
    <button type="submit">Cadastrar tipo</button>
    <button type="reset">Redefinir tipo</button>
    <label>
        <label>

</form>
<br>
<br>


{% endblock conteudo %}
