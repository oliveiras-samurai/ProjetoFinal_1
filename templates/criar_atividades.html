{% extends 'base.html' %}
{% block conteudo %}

<div class="recurso-container">
    <h1 class="recurso-titulo-pagina">Adicionar Tarefa</h1>
    <p class="recurso-subtitulo">Cadastre as informações necessárias para a execução da tarefa.</p>

    <!-- CORREÇÃO 1: Mudado action="#" para a rota correta do Flask que salva os dados -->
    <form action="{{ url_for('criar_atividade') }}" method="POST">

        <!-- Campo 1: Nome -->
        <div class="recurso-grupo">
            <label for="form_nome_tarefa" class="recurso-label"> Nome da Tarefa:</label>
            <input type="text" id="form_nome_tarefa" name="form_nome_tarefa" placeholder="Ex: Manutenção Preventiva, Troca de Óleo" required class="recurso-input">
        </div>

        <!-- Campo 2: Data de Abertura -->
        <div class="recurso-grupo">
            <label for="form_data_abertura" class="recurso-label"> Data de Abertura:</label>
            <input type="date" id="form_data_abertura" name="form_data_abertura" required class="recurso-input">
        </div>

        <!-- Campo 3: Data de Encerramento -->
        <div class="recurso-grupo">
            <label for="form_data_encerramento" class="recurso-label"> Data de Encerramento:</label>
            <input type="date" id="form_data_encerramento" name="form_data_encerramento" class="recurso-input">
        </div>

        <!-- Campo 4: ID do Responsável -->
        <div class="recurso-grupo">
            <label for="form_id_responsavel" class="recurso-label"> ID do Responsável:</label>
            <input type="number" id="form_id_responsavel" name="form_id_responsavel" placeholder="Ex: 1024" min="1" required class="recurso-input">
        </div>

        <!-- Campo 5: Status da Tarefa -->
        <div class="recurso-grupo">
            <label for="form_status_tarefa" class="recurso-label"> Status da Tarefa:</label>
            <select id="form_status_tarefa" name="form_status_tarefa" class="recurso-select">
                <option value="Pendente">Pendente</option>
                <option value=" Andamento">Andamento</option>
                <option value="Concluída">Concluída</option>
                <option value="Cancelada">Cancelada</option>
            </select>
        </div>

        <!-- Campo 6: Equipamento utilizado -->
        <div style="margin-bottom: 25px;">
            <label style="display: block; font-weight: bold; color: #7b1fa2; margin-bottom: 8px; font-size: 14px;">Quais recursos serão utilizados?</label>
            <div style="background: #ffffff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 15px; display: flex; flex-direction: column; gap: 10px; max-height: 150px; overflow-y: auto; box-sizing: border-box;">
                {% for recurso in lista_recursos %}
                <label style="display: flex; align-items: center; gap: 10px; font-weight: 500; color: #333; cursor: pointer; font-size: 14px; margin: 0;">
                    <input type="checkbox" name="form_item" value="{{ recurso.nome }}" style="width: 16px; height: 16px; cursor: pointer;">
                    <span>{{ recurso.nome }} <small style="color: #666;">({{ recurso.tipo }} - Qtd: {{ recurso.quantidade }})</small></span>
                </label>
                {% else %}
                <p style="color: #666; font-size: 14px; margin: 0; font-style: italic;">
                    Nenhum recurso cadastrado para seleção.
                </p>
                {% endfor %}
            </div>
        </div>

        <!-- Campo 7: Prioridade -->
        <div class="recurso-grupo">
            <label for="form_prioridade" class="recurso-label"> Prioridade:</label>
            <select id="form_prioridade" name="form_prioridade" class="recurso-select">
                <option value="Baixa">Baixa</option>
                <option value="Média" selected>Média</option>
                <option value="Alta">Alta</option>
                <option value="Urgente">Urgente</option>
            </select>
        </div>

        <!-- Botões de Ações -->
        <div class="recurso-acoes">
            <!-- CORREÇÃO 2: Alterado type="button" para type="submit" para permitir o envio do formulário -->
            <button type="submit" class="recurso-btn-salvar"> Salvar Tarefa</button>

            <!-- ADICIONADO: Direcionando o botão cancelar de volta para a lista -->
            <a href="{{ url_for('listar_recursos') }}" class="recurso-btn-cancelar">Cancelar</a>
        </div>

    </form>
</div>

{% endblock conteudo %}
