{% extends 'base.html' %}
{% block conteudo %}

<div style="max-width: 800px; margin: 0 auto;">
   <h1 style="font-size: 28px; font-weight: 700; color: #4a148c; margin-top: 0; margin-bottom: 8px;">Perfil do Usuário</h1>
   <p style="color: #666; font-size: 14px; margin-bottom: 30px;">Gerencie suas informações de perfil e estatísticas do sistema.</p>

   <form action="{{ url_for('pessoa') }}" method="POST">

       <!-- Grid de duas colunas identico ao seu visual original -->
       <div style="display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap;">

           <!-- Coluna 1: Informações Pessoais -->
           <div style="flex: 1; min-width: 300px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 25px; box-sizing: border-box;">
               <h3 style="color: #4a148c; margin-top: 0; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
                   📝 Informações Pessoais
               </h3>

               <div style="margin-bottom: 15px;">
                   <label style="display: block; font-weight: bold; color: #4a148c; margin-bottom: 5px; font-size: 14px;">Nome:</label>
                   <input type="text" name="perfil_nome" value="{{ usuario.nome }}" required
                          style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box;">
               </div>

               <div style="margin-bottom: 15px;">
                   <label style="display: block; font-weight: bold; color: #4a148c; margin-bottom: 5px; font-size: 14px;">Cargo:</label>
                   <input type="text" name="perfil_cargo" value="{{ usuario.cargo }}" required
                          style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box;">
               </div>

               <div style="margin-bottom: 5px;">
                   <label style="display: block; font-weight: bold; color: #4a148c; margin-bottom: 5px; font-size: 14px;">Status:</label>
                   <select name="perfil_status" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; background: white; box-sizing: border-box;">
                       <option value="Ativo" {% if usuario.status == 'Ativo' %}selected{% endif %}>Ativo</option>
                       <option value="Inativo" {% if usuario.status == 'Inativo' %}selected{% endif %}>Inativo</option>
                   </select>
               </div>
           </div>

           <!-- Coluna 2: Estatísticas de Uso -->
           <div style="flex: 1; min-width: 300px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 25px; box-sizing: border-box;">
               <h3 style="color: #4a148c; margin-top: 0; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
                   📊 Estatísticas de Uso
               </h3>

               <div style="margin-bottom: 15px;">
                   <label style="display: block; font-weight: bold; color: #4a148c; margin-bottom: 5px; font-size: 14px;">Plataforma:</label>
                   <input type="text" name="perfil_plataforma" value="{{ usuario.plataforma }}" required
                          style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box;">
               </div>

               <div style="margin-bottom: 15px;">
                   <label style="display: block; font-weight: bold; color: #4a148c; margin-bottom: 5px; font-size: 14px;">Ambiente:</label>
                   <input type="text" name="perfil_ambiente" value="{{ usuario.ambiente }}" required
                          style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box;">
               </div>

               <div style="margin-bottom: 5px;">
                   <label style="display: block; font-weight: bold; color: #4a148c; margin-bottom: 5px; font-size: 14px;">Servidor:</label>
                   <input type="text" name="perfil_servidor" value="{{ usuario.servidor }}" required
                          style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box;">
               </div>
           </div>

       </div>

       <!-- Botão inferior centralizado para submeter o cadastro/alteração -->
       <div style="text-align: right;">
           <button type="submit" style="background: #8e24aa; color: white; border: none; padding: 12px 30px; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; transition: background 0.2s;" onmouseover="this.style.background='#7b1fa2'" onmouseout="this.style.background='#8e24aa'">
               💾 Salvar Alterações
           </button>
       </div>

   </form>
</div>

{% endblock conteudo %}
