{% extends 'base.html' %}
{% block conteudo %}

<div style="max-width: 800px; margin: 0 auto;">
    <h1 style="font-size: 28px; font-weight: 700; color: #aa2424; margin-top: 0; margin-bottom: 8px;">Cadastro de Usuário</h1>
    <p style="color: #666; font-size: 14px; margin-bottom: 30px;">Crie seu perfil preenchendo as informações abaixo.</p>

    <form action="{{ url_for('pessoa') }}" method="POST">

        <!-- Grid de duas colunas identico ao seu visual original -->
        <div style="display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap;">

            <!-- Coluna 1: Informações Pessoais -->
            <div style="flex: 1; min-width: 300px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 25px; box-sizing: border-box;">
                <h3 style="color: #a2631f; margin-top: 0; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
                    📝 Informações Pessoais
                </h3>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-weight: bold; color: #a2631f; margin-bottom: 5px; font-size: 14px;">Nome:</label>
                    <input type="text" name="perfil_nome" placeholder="Digite seu nome" required
                           style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-weight: bold; color: #aa5c24; margin-bottom: 5px; font-size: 14px;">Cargo:</label>
                    <input type="text" name="perfil_cargo" placeholder="Ex: Desenvolvedor de Sistemas" required
                           style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 5px;">
                    <label style="display: block; font-weight: bold; color: #aa6724; margin-bottom: 5px; font-size: 14px;">Status:</label>
                    <select name="perfil_status" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; background: white; box-sizing: border-box;">
                        <option value="Ativo" selected>Ativo</option>
                        <option value="Inativo">Inativo</option>
                    </select>
                </div>
            </div>

            <!-- Coluna 2: Estatísticas de Uso -->
            <div style="flex: 1; min-width: 300px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 25px; box-sizing: border-box;">
                <h3 style="color: #a2631f; margin-top: 0; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
                    📊 Estatísticas de Uso
                </h3>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-weight: bold; color: #a2631f; margin-bottom: 5px; font-size: 14px;">Plataforma:</label>
                    <input type="text" name="perfil_plataforma" placeholder="Ex: Python Flask Back-end" required
                           style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-weight: bold; color: #aa6724; margin-bottom: 5px; font-size: 14px;">Ambiente:</label>
                    <input type="text" name="perfil_ambiente" placeholder="Ex: PyCharm IDE" required
                           style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box;">
                </div>
            </div>
        </div>

        <!-- Botão de Enviar o Cadastro -->
        <div style="text-align: right; margin-bottom: 20px;">
            <button type="submit" style="background-color: #b57c1e; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer;">
                💾 Cadastrar Perfil
            </button>
        </div>
    </form>

    <!-- Linha Divisória e Área de Login -->
    <hr style="border: 0; border-top: 1px solid #cbd5e1; margin: 30px 0;">

    <div style="text-align: center; margin-bottom: 40px;">
        <p style="color: #666; font-size: 14px; margin-bottom: 10px;">Já possui uma conta configurada?</p>
        <a href="{{ url_for('login') }}" style="display: inline-block; background-color: transparent; color: #b57c1e; border: 2px solid #b57c1e; padding: 10px 20px; border-radius: 6px; font-size: 14px; font-weight: bold; text-decoration: none; transition: 0.2s;">
            🔑 Ir para o Login
        </a>
    </div>
</div>

{% endblock %}
