{% extends 'base.html' %}
{% block conteudo %}

<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
    <div>
        <h1 style="font-size: 28px; font-weight: 600; color: #aa2424; margin: 0;">Recursos</h1>
        <p style="color: #666; margin: 5px 0 0 0; font-size: 14px;">Consulta e controle de recursos disponíveis.</p>
    </div>
    <!-- O NOVO BOTÃO DE CADASTRAR INTERNO -->
    <a href="{{ url_for('criar_recurso') }}" class="btn-cadastrar-tabela">
        ➕ Novo Recurso
    </a>
</div>

<!-- CONTAINER DA TABELA -->
<div class="tabela-container">
    <table class="tabela-corporativa">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Tipo</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody>
            {% for recurso in dados_recursos %}
            <tr>
                <td style="font-weight: 600;">{{ recurso.nome }}</td>
                <td>
                    <span style=" padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold;">
                        {{ recurso.tipo }}
                    </span>
                </td>
                <td>
                    <form action="/recursos/excluir/{{ recurso.id }}" method="POST" style="margin: 0; display: inline-block; text-align: center ">
                        <button type="submit" class="btn-excluir-tabela">Excluir</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4" style="padding: 30px; text-align: center; color: #aa5c24; font-weight: bold;">
                    Nenhum equipamento localizado.
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock conteudo %}
